services:
  api:
    build: .
    ports:
      - "8010:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./app:/code/app

  worker:
    build: .
    command: celery -A celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./app:/code/app
    working_dir: /code/app

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"