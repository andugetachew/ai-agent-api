name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_user
          POSTGRES_PASSWORD: agent_pass
          POSTGRES_DB: agent_db
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6382:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test .env
        run: |
          cat <<EOF > .env
          ANTHROPIC_API_KEY=dummy-key-for-ci
          DATABASE_URL=postgresql://agent_user:agent_pass@localhost:5436/agent_db
          CELERY_BROKER_URL=redis://localhost:6382/0
          EOF

      - name: Run tests
        run: python -m pytest tests/ -v